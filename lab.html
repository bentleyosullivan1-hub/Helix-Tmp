<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Helix // Global Chat</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   HELIX CHAT
========================================================= */

:root {
    --chat-bg: rgba(6, 9, 22, .94);
    --chat-panel: rgba(15, 19, 38, .86);
    --chat-border: rgba(135,145,255,.16);
    --chat-accent: #7378ff;
    --chat-text: #eef0ff;
    --chat-muted: #78819d;
}


/* PAGE */

.chat-layout {

    width: min(1250px, 96%);

    height: 720px;

    margin: 30px auto 80px;

    display: grid;

    grid-template-columns:
        220px
        minmax(0, 1fr)
        220px;

    overflow: hidden;

    background: var(--chat-bg);

    border: 1px solid var(--chat-border);

    border-radius: 22px;

    box-shadow:
        0 0 70px rgba(80,90,255,.09);

    backdrop-filter: blur(25px);
}


/* =========================================================
   CHANNEL SIDEBAR
========================================================= */

.channel-sidebar {

    background:
        rgba(255,255,255,.025);

    border-right:
        1px solid rgba(255,255,255,.07);

    display: flex;

    flex-direction: column;
}


.server-header {

    height: 62px;

    display: flex;

    align-items: center;

    padding: 0 18px;

    border-bottom:
        1px solid rgba(255,255,255,.07);

    font-weight: 800;

    letter-spacing: .5px;
}


.channel-title {

    padding:
        18px 15px 8px;

    font-size: 10px;

    color: #68718d;

    letter-spacing: 1px;
}


.channels {

    padding: 0 9px;
}


.channel {

    width: 100%;

    border: 0;

    background: transparent;

    color: #8c95b1;

    padding: 10px 11px;

    margin-bottom: 3px;

    border-radius: 8px;

    display: flex;

    gap: 9px;

    align-items: center;

    text-align: left;

    cursor: pointer;

    transition: .15s;
}


.channel:hover {

    background:
        rgba(255,255,255,.055);

    color: white;
}


.channel.active {

    background:
        rgba(110,115,255,.17);

    color: white;
}


/* =========================================================
   MAIN CHAT
========================================================= */

.chat-main {

    min-width: 0;

    display: flex;

    flex-direction: column;
}


.chat-header {

    height: 62px;

    padding: 0 20px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom:
        1px solid rgba(255,255,255,.07);
}


.chat-channel-name {

    font-weight: 800;

    color: white;
}


.chat-topic {

    font-size: 11px;

    color: var(--chat-muted);

    margin-top: 3px;
}


.connection {

    display: flex;

    gap: 7px;

    align-items: center;

    font-size: 11px;

    color: #69738e;
}


.connection-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #ff5151;
}


.connection-dot.online {

    background: #55ff9a;

    box-shadow:
        0 0 10px #55ff9a;
}


/* =========================================================
   MESSAGES
========================================================= */

.messages {

    flex: 1;

    overflow-y: auto;

    padding: 20px;

    display: flex;

    flex-direction: column;

    gap: 15px;
}


.message {

    display: flex;

    gap: 11px;

    position: relative;
}


.avatar {

    width: 38px;

    height: 38px;

    flex-shrink: 0;

    border-radius: 50%;

    display: grid;

    place-items: center;

    color: white;

    font-weight: 800;

    font-size: 13px;

    background:
        linear-gradient(
            135deg,
            #767bff,
            #464bd0
        );
}


.message-body {

    min-width: 0;
}


.message-top {

    display: flex;

    align-items: baseline;

    gap: 8px;
}


.message-user {

    font-size: 13px;

    font-weight: 700;

    color: #aab0ff;
}


.message-time {

    font-size: 9px;

    color: #535d78;
}


.message-text {

    margin-top: 4px;

    color: #dfe2f4;

    line-height: 1.45;

    word-break: break-word;
}


.message-actions {

    margin-left: auto;

    display: none;

    gap: 4px;
}


.message:hover .message-actions {

    display: flex;
}


.small-action {

    border: 0;

    background:
        rgba(255,255,255,.06);

    color: #aeb5d0;

    border-radius: 7px;

    padding: 5px 7px;

    cursor: pointer;
}


.small-action:hover {

    color: white;

    background:
        rgba(255,80,80,.18);
}


/* =========================================================
   TYPING
========================================================= */

.typing {

    height: 24px;

    padding: 0 20px;

    color: #69738e;

    font-size: 10px;
}


/* =========================================================
   INPUT
========================================================= */

.input-area {

    padding: 12px 15px 16px;
}


.chat-form {

    display: flex;

    gap: 8px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 12px;

    padding: 5px;
}


.chat-form input {

    flex: 1;

    min-width: 0;

    border: 0;

    outline: 0;

    background: transparent;

    color: white;

    padding: 11px;
}


.send-button {

    border: 0;

    border-radius: 9px;

    background: var(--chat-accent);

    color: white;

    font-weight: 700;

    padding: 0 16px;

    cursor: pointer;
}


/* =========================================================
   PREMIUM BADGE
========================================================= */

.premium-badge {

    display: inline-flex;

    align-items: center;

    margin-left: 6px;

    padding: 1px 7px;

    border-radius: 999px;

    font-size: .62rem;

    font-weight: 700;

    letter-spacing: .04em;

    color: #16121f;

    background: linear-gradient(135deg, #ffd76a, #ff9ecf 60%, var(--chat-accent));
}


/* =========================================================
   ACCOUNT PANEL
========================================================= */

.account-panel {

    padding: 14px 16px;

    border-bottom: 1px solid var(--chat-border);

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.account-panel .account-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 8px;

    font-size: .8rem;

    color: var(--chat-muted);
}

.account-panel .account-name {

    color: var(--chat-text);

    font-weight: 600;
}

.account-panel form {

    display: none;

    flex-direction: column;

    gap: 6px;
}

.account-panel form.open {

    display: flex;
}

.account-panel input {

    padding: 8px 10px;

    border-radius: 8px;

    border: 1px solid var(--chat-border);

    background: rgba(255,255,255,.04);

    color: var(--chat-text);

    font-size: .8rem;
}

.account-panel .account-actions {

    display: flex;

    gap: 6px;
}

.account-panel button {

    flex: 1;

    padding: 7px 10px;

    border-radius: 8px;

    border: 1px solid var(--chat-border);

    background: rgba(255,255,255,.05);

    color: var(--chat-text);

    font-size: .75rem;

    cursor: pointer;
}

.account-panel button.primary {

    background: var(--chat-accent);

    border-color: transparent;

    color: white;

    font-weight: 600;
}

.account-panel .account-msg {

    font-size: .72rem;

    min-height: 1em;

    color: var(--chat-muted);
}

.link-button {

    background: none;

    border: 0;

    color: var(--chat-accent);

    font-size: .78rem;

    font-weight: 600;

    cursor: pointer;

    padding: 0;
}


/* =========================================================
   USER SIDEBAR
========================================================= */

.user-sidebar {

    border-left:
        1px solid rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.018);

    overflow-y: auto;
}


.user-header {

    height: 62px;

    display: flex;

    align-items: center;

    padding: 0 16px;

    border-bottom:
        1px solid rgba(255,255,255,.07);

    font-size: 11px;

    font-weight: 800;

    color: #747e9a;

    letter-spacing: 1px;
}


.user-list {

    padding: 12px;
}


.user {

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 7px;

    border-radius: 8px;
}


.user:hover {

    background:
        rgba(255,255,255,.04);
}


.user-avatar {

    width: 30px;

    height: 30px;

    border-radius: 50%;

    display: grid;

    place-items: center;

    background:
        linear-gradient(
            135deg,
            #7075ff,
            #4146bd
        );

    color: white;

    font-size: 10px;

    font-weight: 800;
}


.user-name {

    color: #b3bad0;

    font-size: 11px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


.online-indicator {

    margin-left: auto;

    width: 7px;

    height: 7px;

    background: #55ff9a;

    border-radius: 50%;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px) {

    .chat-layout {

        grid-template-columns:
            180px
            minmax(0, 1fr);

    }

    .user-sidebar {

        display: none;
    }
}


@media(max-width:650px) {

    .chat-layout {

        width: 98%;

        height: 76vh;

        grid-template-columns: 1fr;

        border-radius: 16px;
    }

    .channel-sidebar {

        display: none;
    }

    .message-actions {

        display: flex;
    }
}

</style>
</head>

<script>

/* ============================================================
   HELIX GLOBAL CHAT
============================================================ */


/* CHANGE THESE */

const SUPABASE_URL =
    "https://biqoeaxxzegfvlxopazd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_U9ZX17upjBz5nZ47rpwpNQ_Ve2xu-gg";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ============================================================
   STATE
============================================================ */

let currentUser = null;

let profile = null;

// user_ids known to currently be premium, so message history (which
// doesn't carry is_premium itself) can still show the badge.
let premiumUserIds = new Set();

let currentChannel = null;

let chatChannel = null;

let typingTimer = null;

let presenceUsers = {};

let offlineMode = false;

const offlineMessagesKey = "helixOfflineMessages";


/* ============================================================
   ELEMENTS
============================================================ */

const channelsEl =
    document.getElementById("channels");

const messagesEl =
    document.getElementById("messages");

const userListEl =
    document.getElementById("userList");

const onlineCount =
    document.getElementById("onlineCount");

const channelName =
    document.getElementById("channelName");

const messageInput =
    document.getElementById("messageInput");

const chatForm =
    document.getElementById("chatForm");

const typingEl =
    document.getElementById("typing");

const connectionDot =
    document.getElementById("connectionDot");

const connectionText =
    document.getElementById("connectionText");


/* ============================================================
   RANDOM AVATAR
============================================================ */

function avatarLetter(name) {

    return (
        name ||
        "?"
    )
        .trim()
        .charAt(0)
        .toUpperCase();

}


/* ============================================================
   STATUS
============================================================ */

/* NOTE: enableOfflineChat() lives in js/lab-fallback.js — that file
   was referenced by the <script> tag above but was missing from
   the deployed site, which is the actual bug that broke chat: every
   Supabase error path called an undefined function and threw
   instead of falling back. See js/lab-fallback.js. */

function setConnection(
    online,
    text
) {

    connectionDot.classList.toggle(
        "online",
        online
    );

    connectionText.textContent =
        text;
}


/* ============================================================
   AUTH
============================================================ */

async function authenticate() {

    let session;

    try {

        const {
            data: sessionData,
            error: sessionError
        } = await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        session = sessionData.session;


    if (!session) {

        const {
            data,
            error
        } =
            await supabase.auth.signInAnonymously();


        if (error) {

            console.error(error);

            enableOfflineChat("Chat sign-in failed");

            return false;
        }


        session = data.session;
    }

    } catch (error) {

        console.error(error);

        setConnection(false, "Connection failed");

        alert("Could not connect to Helix. Check the chat service configuration and try again.");

        return false;
    }


    currentUser =
        session.user;


    return true;
}


/* ============================================================
   PROFILE
============================================================ */

async function loadProfile() {

    const {
        data,
        error: profileError
    } = await supabase

        .from("chat_profiles")

        .select("*")

        .eq(
            "user_id",
            currentUser.id
        )

        .maybeSingle();


    if (profileError) {

        console.error(profileError);

        enableOfflineChat("Profile service unavailable");

        return;
    }

    if (data) {

        profile = data;

        return;
    }


    const randomName =
        "Helix-" +
        Math.floor(
            1000 +
            Math.random() * 9000
        );


    const newProfile = {

        user_id:
            currentUser.id,

        username:
            randomName,

        avatar_seed:
            randomName,

        is_moderator:
            false

    };


    const {
        data: created,
        error
    } =
        await supabase

            .from("chat_profiles")

            .insert(newProfile)

            .select()

            .single();


    if (error) {

        console.error(error);

        enableOfflineChat("Profile service unavailable");

        return;
    }


    profile = created;

}


/* ============================================================
   PREMIUM
============================================================ */

async function loadPremiumUsers() {

    if (offlineMode) return;

    const {
        data,
        error
    } =
        await supabase

            .from("chat_profiles")

            .select("user_id")

            .eq("is_premium", true);

    if (error) {

        console.error(error);

        return;
    }

    premiumUserIds =
        new Set(
            data.map(row => row.user_id)
        );

}

/* ============================================================
   ACCOUNT UI (email/password on top of anonymous chat)
============================================================ */

const accountToggle = document.getElementById("accountToggle");
const accountName = document.getElementById("accountName");
const accountMsg = document.getElementById("accountMsg");
const signInForm = document.getElementById("signInForm");
const signUpBtn = document.getElementById("signUpBtn");

function applyAccountUI() {

    const isAnonymous =
        !currentUser?.email;

    accountName.textContent =
        profile?.username || "Guest";

    if (profile?.is_premium) {

        accountName.appendChild(
            premiumBadge()
        );
    }

    accountToggle.textContent =
        isAnonymous ? "Sign in" : "Sign out";

}

accountToggle?.addEventListener("click", async () => {

    const isAnonymous =
        !currentUser?.email;

    if (isAnonymous) {

        signInForm.classList.toggle("open");

        return;
    }

    await supabase.auth.signOut();

    location.reload();

});

signInForm?.addEventListener("submit", async event => {

    event.preventDefault();

    accountMsg.textContent = "Signing in…";

    const email = document.getElementById("signInEmail").value.trim();
    const password = document.getElementById("signInPassword").value;

    const { error } =
        await supabase.auth.signInWithPassword({ email, password });

    if (error) {

        accountMsg.textContent = error.message;
        return;
    }

    location.reload();

});

signUpBtn?.addEventListener("click", async () => {

    const email = document.getElementById("signInEmail").value.trim();
    const password = document.getElementById("signInPassword").value;

    if (!email || !password) {

        accountMsg.textContent = "Enter an email and password first.";
        return;
    }

    accountMsg.textContent = "Creating account…";

    // If the current session is anonymous (the normal state for every
    // guest visiting the chat), LINK it to the new email/password
    // instead of creating a brand-new, unrelated user. Linking keeps
    // the same user_id, so the existing chat_profiles row (username,
    // is_premium, is_moderator) and message history carry over instead
    // of being silently orphaned under a throwaway anonymous account.
    const isAnonymous = !!currentUser?.is_anonymous;

    const { data, error } = isAnonymous
        ? await supabase.auth.updateUser({ email, password })
        : await supabase.auth.signUp({ email, password });

    if (error) {

        accountMsg.textContent = error.message;
        return;
    }

    if (!isAnonymous && !data.session) {

        accountMsg.textContent = "Check your email to confirm, then sign in.";
        return;
    }

    if (isAnonymous) {

        accountMsg.textContent = "Account linked. If email confirmations are enabled, check your inbox to finish confirming.";
    }

    location.reload();

});


function premiumBadge() {

    const badge =
        document.createElement("span");

    badge.className =
        "premium-badge";

    badge.textContent =
        "✦ PREMIUM";

    badge.title =
        "Helix Premium member";

    return badge;

}


/* ============================================================
   CHANNELS
============================================================ */

async function loadChannels() {

    if (offlineMode) return;

    const {
        data,
        error
    } =
        await supabase

            .from("chat_channels")

            .select("*")

            .order(
                "position",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(error);

        enableOfflineChat("Chat service unavailable");

        return;
    }


    channelsEl.innerHTML = "";


    data.forEach(channel => {

        const button =
            document.createElement("button");


        button.className =
            "channel";


        button.dataset.id =
            channel.id;


        button.innerHTML =
            `<span>${channel.icon}</span>
             <span># ${channel.name}</span>`;


        button.addEventListener(
            "click",
            () => {

                selectChannel(channel);

            }
        );


        channelsEl.appendChild(button);

    });


    if (data.length) {

        selectChannel(data[0]);

    } else {

        enableOfflineChat("No chat channels are configured");

    }

}


/* ============================================================
   SELECT CHANNEL
============================================================ */

async function selectChannel(channel) {

    currentChannel =
        channel;


    channelName.textContent =
        "# " + channel.name;


    messageInput.placeholder =
        "Message #" + channel.name;


    document
        .querySelectorAll(".channel")
        .forEach(button => {

            button.classList.toggle(
                "active",
                Number(button.dataset.id) ===
                Number(channel.id)
            );

        });


    messagesEl.innerHTML = "";


    await loadMessages();


    setupRealtime();

}


/* ============================================================
   LOAD MESSAGES
============================================================ */

async function loadMessages() {

    if (!currentChannel)
        return;

    if (offlineMode) {

        messagesEl.innerHTML = "";

        JSON.parse(localStorage.getItem(offlineMessagesKey) || "[]")
            .forEach(renderMessage);

        scrollMessages();

        return;
    }


    const {
        data,
        error
    } =
        await supabase

            .from("chat_messages")

            .select("*")

            .eq(
                "channel_id",
                currentChannel.id
            )

            .order(
                "created_at",
                {
                    ascending: true
                }
            )

            .limit(100);


    if (error) {

        console.error(error);

        return;
    }


    messagesEl.innerHTML = "";


    data.forEach(
        renderMessage
    );


    scrollMessages();

}


/* ============================================================
   RENDER MESSAGE
============================================================ */

function renderMessage(message) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        avatarLetter(
            message.username
        );


    const body =
        document.createElement("div");

    body.className =
        "message-body";


    const top =
        document.createElement("div");

    top.className =
        "message-top";


    const user =
        document.createElement("span");

    user.className =
        "message-user";

    user.textContent =
        message.username;

    top.appendChild(user);

    if (premiumUserIds.has(message.user_id)) {

        top.appendChild(
            premiumBadge()
        );

    }

    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        new Date(
            message.created_at
        ).toLocaleString();


    top.appendChild(time);


    const text =
        document.createElement("div");

    text.className =
        "message-text";

    text.textContent =
        message.message;


    const actions =
        document.createElement("div");

    actions.className =
        "message-actions";


    const canDelete =
        message.user_id ===
            currentUser.id ||
        profile?.is_moderator;


    if (canDelete) {

        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "small-action";

        deleteButton.textContent =
            "🗑";

        deleteButton.title =
            "Delete message";


        deleteButton.addEventListener(
            "click",
            () => {

                deleteMessage(
                    message.id
                );

            }
        );


        actions.appendChild(
            deleteButton
        );

    }


    body.appendChild(top);

    body.appendChild(text);


    if (actions.children.length) {

        body.appendChild(actions);

    }


    wrapper.appendChild(avatar);

    wrapper.appendChild(body);


    messagesEl.appendChild(wrapper);

}


/* ============================================================
   DELETE
============================================================ */

async function deleteMessage(id) {

    if (
        !confirm(
            "Delete this message?"
        )
    ) {

        return;

    }

    if (offlineMode) {

        const messages = JSON.parse(localStorage.getItem(offlineMessagesKey) || "[]")
            .filter(message => message.id !== id);

        localStorage.setItem(offlineMessagesKey, JSON.stringify(messages));

        loadMessages();

        return;
    }


    const {
        error
    } =
        await supabase

            .from("chat_messages")

            .delete()

            .eq(
                "id",
                id
            );


    if (error) {

        console.error(error);

        alert(
            "You don't have permission to delete this message."
        );

    }

}


/* ============================================================
   REALTIME CHAT
============================================================ */

async function setupRealtime() {

    if (offlineMode) return;

    if (chatChannel) {

        await supabase.removeChannel(
            chatChannel
        );

    }


    chatChannel =
        supabase

            .channel(
                "helix-" +
                currentChannel.id
            )

            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "chat_messages",
                    filter:
                        `channel_id=eq.${currentChannel.id}`
                },
                payload => {

                    renderMessage(
                        payload.new
                    );

                    scrollMessages();

                }
            )

            .on(
                "postgres_changes",
                {
                    event: "DELETE",
                    schema: "public",
                    table: "chat_messages"
                },
                payload => {

                    const nodes =
                        messagesEl.querySelectorAll(
                            ".message"
                        );

                    /*
                        Reloading keeps the client
                        synchronized after deletions.
                    */

                    loadMessages();

                }
            )

            .on(
                "presence",
                {
                    event: "sync"
                },
                () => {

                    updatePresence();

                }
            )

            .on(
                "broadcast",
                {
                    event: "typing"
                },
                payload => {

                    handleTyping(
                        payload.payload
                    );

                }
            )

            .subscribe(
                async status => {

                    if (
                        status ===
                        "SUBSCRIBED"
                    ) {

                        setConnection(
                            true,
                            "Connected"
                        );


                        await chatChannel.track({

                            user_id:
                                currentUser.id,

                            username:
                                profile.username,

                            avatar:
                                avatarLetter(
                                    profile.username
                                ),

                            is_premium:
                                !!profile.is_premium,

                            typing:
                                false

                        });

                    }

                }
            );

}


/* ============================================================
   PRESENCE
============================================================ */

function updatePresence() {

    if (!chatChannel)
        return;


    const state =
        chatChannel.presenceState();


    presenceUsers = {};


    Object.values(state)
        .flat()
        .forEach(user => {

            presenceUsers[
                user.user_id
            ] = user;

        });


    renderUsers();

}


/* ============================================================
   ONLINE USERS
============================================================ */

function renderUsers() {

    userListEl.innerHTML = "";


    const users =
        Object.values(
            presenceUsers
        );


    onlineCount.textContent =
        users.length;


    users.forEach(user => {

        const row =
            document.createElement("div");

        row.className =
            "user";


        const avatar =
            document.createElement("div");

        avatar.className =
            "user-avatar";

        avatar.textContent =
            avatarLetter(
                user.username
            );


        const name =
            document.createElement("span");

        name.className =
            "user-name";

        name.textContent =
            user.username;


        const dot =
            document.createElement("span");

        dot.className =
            "online-indicator";


        row.appendChild(avatar);

        row.appendChild(name);

        if (user.is_premium) {

            row.appendChild(
                premiumBadge()
            );

        }

        row.appendChild(dot);


        userListEl.appendChild(row);

    });

}


/* ============================================================
   TYPING
============================================================ */

function sendTyping(isTyping) {

    if (!chatChannel)
        return;


    chatChannel.send({

        type: "broadcast",

        event: "typing",

        payload: {

            user_id:
                currentUser.id,

            username:
                profile.username,

            typing:
                isTyping

        }

    });

}


function handleTyping(data) {

    if (
        data.user_id ===
        currentUser.id
    ) {

        return;

    }


    if (!data.typing) {

        typingEl.textContent =
            "";

        return;

    }


    typingEl.textContent =
        `${data.username} is typing...`;


    clearTimeout(
        typingTimer
    );


    typingTimer =
        setTimeout(
            () => {

                typingEl.textContent =
                    "";

            },
            2500
        );

}


/* ============================================================
   INPUT TYPING
============================================================ */

messageInput.addEventListener(
    "input",
    () => {

        sendTyping(true);


        clearTimeout(
            typingTimer
        );


        typingTimer =
            setTimeout(
                () => {

                    sendTyping(false);

                },
                1000
            );

    }
);


/* ============================================================
   SEND
============================================================ */

chatForm.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const text =
            messageInput.value.trim();


        if (!text)
            return;


        if (text.length > 500)
            return;

        if (offlineMode) {

            const messages = JSON.parse(localStorage.getItem(offlineMessagesKey) || "[]");

            messages.push({
                id: crypto.randomUUID(),
                user_id: currentUser.id,
                username: profile.username,
                avatar_seed: profile.avatar_seed,
                message: text,
                created_at: new Date().toISOString()
            });

            localStorage.setItem(offlineMessagesKey, JSON.stringify(messages));

            messageInput.value = "";

            loadMessages();

            return;
        }


        const {
            error
        } =
            await supabase

                .from(
                    "chat_messages"
                )

                .insert({

                    channel_id:
                        currentChannel.id,

                    user_id:
                        currentUser.id,

                    username:
                        profile.username,

                    avatar_seed:
                        profile.avatar_seed,

                    message:
                        text

                });


        if (error) {

            console.error(error);

            alert(
                "Unable to send message."
            );

            return;

        }


        messageInput.value =
            "";

        sendTyping(false);

    }
);


/* ============================================================
   SCROLL
============================================================ */

function scrollMessages() {

    messagesEl.scrollTop =
        messagesEl.scrollHeight;

}


/* ============================================================
   START
============================================================ */

async function start() {

    setConnection(
        false,
        "Connecting"
    );


    const authenticated =
        await authenticate();


    if (!authenticated)
        return;


    await loadProfile();


    if (!profile && !offlineMode) {

        setConnection(
            false,
            "Profile unavailable"
        );

        return;
    }


    await loadPremiumUsers();

    applyAccountUI();

    await loadChannels();

}


start();

</script>
