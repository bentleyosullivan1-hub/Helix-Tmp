<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Helix // Admin</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-shell { max-width: 480px; margin: 100px auto; padding: 0 20px; }
  .admin-box {
    padding: 32px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--panel-strong);
    box-shadow: var(--shadow);
  }
  .admin-box h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .admin-box > p { color: var(--muted); font-size: .9rem; margin: 0 0 22px; line-height: 1.6; }
  .admin-box label { display: block; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; margin: 16px 0 6px; color: var(--muted); }
  .admin-box input, .admin-box select {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,.03); color: var(--text); font: inherit; box-sizing: border-box;
  }
  .admin-box input:focus, .admin-box select:focus { outline: none; border-color: var(--a); box-shadow: 0 0 0 3px rgba(109,225,255,.12); }
  .admin-box button.submit {
    margin-top: 22px; width: 100%; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(100deg, #4bdcff, #9675ff); color: #040510; font-weight: 700;
  }
  .admin-box button.submit:disabled { opacity: .5; cursor: default; }
  .admin-box button.submit:hover:not(:disabled) { box-shadow: 0 0 20px rgba(75,220,255,.4); }
  #adminResult { margin-top: 16px; font-size: .82rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--muted); }
  #adminResult.ok { color: var(--c); }
  #adminResult.err { color: #ff8ba0; }
</style>
</head>
<body data-page="admin">
<div id="cursor"></div><div id="cursorGlow"></div><canvas id="stars"></canvas>
<header class="nav">
  <a class="logo" href="index.html"><span>🕹️</span> HELIX</a>
  <nav>
    <a href="index.html">Index</a>
    <a href="games.html">Games</a>
    <a href="lab.html">Chat</a>
    <a href="viewer.html">Proxies</a>
    <a href="about.html">Settings</a>
  </nav>
  <button class="pill" onclick="toggleTheme()">◐ Interface</button>
</header>

<main class="admin-shell">
  <div class="admin-box">
    <h1>Helix Admin</h1>
    <p>Grant or revoke premium for a chat user. This calls the protected <code>/api/admin/set-premium</code> function — your admin secret is never written into this page and only lives in this tab's memory while you use it.</p>

    <label for="adminSecret">Admin secret</label>
    <input id="adminSecret" type="password" placeholder="ADMIN_SECRET" autocomplete="off">

    <label for="lookupType">Look up by</label>
    <select id="lookupType">
      <option value="username">Chat username</option>
      <option value="email">Account email</option>
    </select>

    <label for="lookupValue">Value</label>
    <input id="lookupValue" type="text" placeholder="Helix-1234 or person@example.com">

    <label for="premiumValue">Premium</label>
    <select id="premiumValue">
      <option value="true">Grant premium</option>
      <option value="false">Revoke premium</option>
    </select>

    <button id="submitBtn" class="submit" type="button">Update</button>
    <div id="adminResult"></div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
const btn = document.getElementById("submitBtn");
const result = document.getElementById("adminResult");

btn.addEventListener("click", async () => {
  const secret = document.getElementById("adminSecret").value.trim();
  const lookupType = document.getElementById("lookupType").value;
  const lookupValue = document.getElementById("lookupValue").value.trim();
  const premium = document.getElementById("premiumValue").value === "true";

  result.className = "";

  if (!secret || !lookupValue) {
    result.textContent = "Fill in the admin secret and a username/email.";
    result.className = "err";
    return;
  }

  btn.disabled = true;
  result.textContent = "Working…";

  try {
    const res = await fetch("/api/admin/set-premium", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-secret": secret
      },
      body: JSON.stringify({
        [lookupType]: lookupValue,
        premium
      })
    });

    const data = await res.json();

    if (!res.ok) {
      result.textContent = "Error: " + (data.error || res.status);
      result.className = "err";
    } else {
      result.textContent = "Success:\n" + JSON.stringify(data.profile, null, 2);
      result.className = "ok";
    }
  } catch (err) {
    result.textContent = "Request failed: " + err.message;
    result.className = "err";
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
